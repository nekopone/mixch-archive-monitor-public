name: MixChannel Archive Monitor (temporary public runner)

run-name: >-
  Archive Monitor / ${{ github.event_name == 'schedule' && format('cron {0}', github.event.schedule) || format('manual by {0}', github.actor) }}

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions の schedule は UTC 基準です。
    # 毎日 JST 06:07（UTC前日21:07）
    - cron: '7 21 * * *'
    # 毎日 JST 17:07, 19:07（UTC同日08:07,10:07）
    - cron: '7 8,10 * * *'
    # 毎日 JST 21:07（UTC同日12:07）
    - cron: '7 12 * * *'
    # 土日のみ JST 08:07（UTC前日23:07）
    - cron: '7 23 * * 5,6'
    # 土日のみ JST 14:07（UTC同日05:07）
    - cron: '7 5 * * 6,0'

permissions:
  contents: read
  actions: read

concurrency:
  group: mixch-archive-public-runner
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check temporary offload period
        id: temporary
        shell: bash
        run: |
          today_jst="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          echo "today_jst=${today_jst}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${today_jst}" < "2026-09-01" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
            echo "Temporary public offload ended on 2026-09-01 JST."
          fi

      - name: Checkout public code
        if: steps.temporary.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout private data
        if: steps.temporary.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: nekopone/mixch
          ssh-key: ${{ secrets.PRIVATE_DATA_SSH_KEY }}
          ssh-strict: true
          path: private-data
          sparse-checkout: |
            watchlist.json
            state.json
            activity_state.json
          sparse-checkout-cone-mode: false

      - name: Setup Python
        if: steps.temporary.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.temporary.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Ensure Chrome is available
        if: steps.temporary.outputs.run == 'true'
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub \
              | sudo gpg --dearmor -o /usr/share/keyrings/google-linux-signing-keyring.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-signing-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
              | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          google-chrome --version

      - name: Validate private JSON files
        if: steps.temporary.outputs.run == 'true'
        run: |
          python -m json.tool private-data/watchlist.json >/dev/null
          python -m json.tool private-data/state.json >/dev/null
          python -m json.tool private-data/activity_state.json >/dev/null

      - name: Prepare sanitized run metrics
        if: steps.temporary.outputs.run == 'true'
        run: |
          : > run_metrics.jsonl

      - name: Run watcher
        if: steps.temporary.outputs.run == 'true'
        env:
          MIXCH_DATA_DIR: private-data
          PUBLIC_LOGS: 'true'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python mixcha_watcher.py

      - name: Commit updated private data
        if: steps.temporary.outputs.run == 'true' && success()
        working-directory: private-data
        shell: bash
        run: |
          git config user.name "mixch-bot"
          git config user.email "bot@example.com"
          git add -- state.json activity_state.json watchlist.json

          if git diff --cached --quiet; then
            echo "No private data changes to commit."
            exit 0
          fi

          git commit -m "chore(bot): update archive monitor state [skip ci]"

          # スマホ管理画面や名前取得処理が同時に更新した場合に、
          # その変更を上書きせず取り込んでから送信します。
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload sanitized run metrics
        if: steps.temporary.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v6
        with:
          name: sanitized-run-metrics-${{ github.run_id }}
          path: run_metrics.jsonl
          if-no-files-found: warn
          retention-days: 3
